<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>並び替え演習 | SOMMELIER MASTER</title>

  <link rel="stylesheet" href="style.css">


  <style>

    .order-header {
      margin-bottom: 20px;
    }


    .order-back {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }


    .order-title {
      margin: 0;
      color: var(--primary);
      font-family: Georgia, "Times New Roman", "Yu Mincho", serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: .04em;
    }


    .order-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }


    .order-select-box {
      margin-bottom: 16px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-card);
      background: var(--surface);
    }


    .order-select-box label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }


    .order-select-box select {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .order-select-box .select-group + .select-group {
      margin-top: 12px;
    }

    .order-start-actions {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .order-random-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media (max-width: 420px) {
      .order-random-actions {
        grid-template-columns: 1fr;
      }
    }


    .order-question {
      margin-bottom: 13px;
      padding: 14px 15px;
      border-left: 3px solid var(--memory);
      border-radius: 9px;
      background: var(--memory-soft);
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.6;
    }


    .order-guide {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }


    .order-list {
      display: grid;
      gap: 8px;
    }


    .order-item {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 8px;

      min-height: 56px;
      padding: 8px 9px;

      border: 1px solid var(--line);
      border-radius: 10px;

      background: var(--surface);

      cursor: grab;
    }


    .order-item:active {
      cursor: grabbing;
    }


    .order-item.dragging {
      opacity: .45;
    }


    .order-item.correct {
      border-color: #CFE2D6;
      background: var(--success-soft);
    }


    .order-item.wrong {
      border-color: #EACDCD;
      background: var(--danger-soft);
    }


    .order-position {
      color: var(--memory);
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }


    .order-name {
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.45;
    }


    .order-move-buttons {
      display: flex;
      gap: 4px;
    }


    .order-move-btn {
      width: 36px;
      height: 36px;
      padding: 0;

      border: 1px solid var(--line);
      border-radius: 8px;

      background: var(--surface-soft);
      color: var(--text);

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
    }


    .order-move-btn:disabled {
      opacity: .3;
      cursor: default;
    }


    .order-result-text {
      grid-column: 2 / -1;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 700;
    }


    .order-item.correct .order-result-text {
      color: var(--success);
    }


    .order-item.wrong .order-result-text {
      color: var(--danger);
    }


    .order-actions {
      display: grid;
      grid-template-columns: 1.4fr .8fr;
      gap: 9px;
      margin-top: 18px;
    }


    .order-summary {
      margin-top: 24px;
    }


    .order-score {
      margin-bottom: 14px;
      padding: 15px;

      border: 1px solid var(--line);
      border-radius: 10px;

      background: var(--surface);

      text-align: center;
    }


    .order-score-main {
      display: block;
      color: var(--text);
      font-size: 21px;
      font-weight: 800;
    }


    .order-score-sub {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }


    .complete-title {
      margin: 25px 0 10px;
      color: var(--primary);
      font-size: 16px;
      font-weight: 800;
    }


    .complete-order {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }


    .complete-row {
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 8px;
      align-items: center;

      min-height: 45px;
      padding: 8px 12px;

      border-bottom: 1px solid var(--line);
    }


    .complete-row:last-child {
      border-bottom: 0;
    }


    .complete-number {
      color: var(--memory);
      font-size: 14px;
      font-weight: 800;
    }


    .complete-name {
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
      line-height: 1.5;
    }


    @media (max-width: 380px) {

      .order-item {
        grid-template-columns: 27px 1fr auto;
        padding-left: 7px;
        padding-right: 7px;
      }


      .order-move-btn {
        width: 33px;
        height: 36px;
      }


      .order-name {
        font-size: 12px;
      }

    }

  </style>

</head>


<body>

  <div class="container">


    <div class="order-header">

      <a
        href="index.html"
        class="order-back">
        ← メインに戻る
      </a>


      <h1 class="order-title">
        並び替え演習
      </h1>


      <p class="order-subtitle">
        位置・順序をまとめて覚える
      </p>

    </div>



    <div class="order-select-box">

      <div class="select-group">
        <label for="order-category-select">
          カテゴリ
        </label>
        <select id="order-category-select">
          <option value="">すべてのカテゴリ</option>
        </select>
      </div>

      <div class="select-group">
        <label for="order-set-select">
          問題
        </label>
        <select id="order-set-select"></select>
      </div>

      <div class="order-start-actions">
        <button
          id="btn-start-selected"
          type="button"
          class="btn btn-action">
          この問題を開始
        </button>

        <div class="order-random-actions">
          <button
            id="btn-random-category"
            type="button"
            class="btn btn-glass">
            このカテゴリからランダム
          </button>

          <button
            id="btn-random-all"
            type="button"
            class="btn btn-glass">
            全問題からランダム
          </button>
        </div>
      </div>

    </div>



    <div
      id="order-question"
      class="order-question">
    </div>



    <p class="order-guide">
      ドラッグ、または上下ボタンで正しい順番に並べ替えてください。
    </p>



    <div
      id="order-list"
      class="order-list">
    </div>



    <div class="order-actions">

      <button
        id="btn-check"
        type="button"
        class="btn btn-action">
        答え合わせ
      </button>


      <button
        id="btn-reset"
        type="button"
        class="btn btn-glass">
        リセット
      </button>

    </div>



    <div
      id="order-summary"
      class="order-summary hidden">


      <div class="order-score">

        <span
          id="order-score-main"
          class="order-score-main">
        </span>

        <span class="order-score-sub">
          正しい位置
        </span>

      </div>



      <div class="complete-title">
        正しい並び
      </div>


      <div
        id="complete-order"
        class="complete-order">
      </div>

    </div>


  </div>

  <script src="study-tracking.js"></script>

  <script>

    const GAS_API_URL =
      "https://script.google.com/macros/s/AKfycbyJ3xJCkhakLUI_8mCsA6MPVrMXKTKuxIMSctkaJpnOmKFJ_ogq4hycm-3rtCcPMDBEKw/exec";


    let orderSets = [];
    let currentSet = null;
    let currentItems = [];
    let checked = false;
    let draggedIndex = null;


    const categorySelect =
      document.getElementById("order-category-select");

    const setSelect =
      document.getElementById("order-set-select");

    const questionElement =
      document.getElementById("order-question");

    const orderList =
      document.getElementById("order-list");

    const summary =
      document.getElementById("order-summary");

    const scoreMain =
      document.getElementById("order-score-main");

    const completeOrder =
      document.getElementById("complete-order");


    async function init() {

      try {

        categorySelect.disabled = true;

        setSelect.innerHTML =
          "<option>読み込み中...</option>";

        setSelect.disabled = true;


        const response =
          await fetch(GAS_API_URL);

        if (!response.ok) {
          throw new Error("データ取得失敗");
        }


        const allData =
          await response.json();

        const rows =
          allData["並び替え問題"] || [];


        if (rows.length === 0) {

          setSelect.innerHTML =
            "<option>問題が登録されていません</option>";

          return;
        }


        createOrderSets(rows);

        renderCategorySelect();
        updateProblemSelect();

        categorySelect.disabled = false;
        setSelect.disabled = false;

        if (orderSets.length > 0) {
          setSelect.value = orderSets[0].id;
          loadSet(orderSets[0].id);
        }


      } catch (error) {

        console.error(error);

        setSelect.innerHTML =
          "<option>データ取得エラー</option>";

        alert(
          "並び替え問題の読み込みに失敗しました。"
        );

      }


      categorySelect.addEventListener(
        "change",
        updateProblemSelect
      );


      document.getElementById(
        "btn-start-selected"
      ).addEventListener(
        "click",
        startSelectedOrder
      );


      document.getElementById(
        "btn-random-category"
      ).addEventListener(
        "click",
        startRandomCategoryOrder
      );


      document.getElementById(
        "btn-random-all"
      ).addEventListener(
        "click",
        startRandomAllOrder
      );


      document.getElementById(
        "btn-check"
      ).addEventListener(
        "click",
        checkAnswers
      );


      document.getElementById(
        "btn-reset"
      ).addEventListener(
        "click",
        resetQuiz
      );

    }


    // ===============================
    // スプレッドシート → 問題セット化
    // 同じIDの行を1問としてまとめる
    // ===============================

    function createOrderSets(rows) {

      const setMap = {};


      rows.forEach(row => {

        const id =
          String(row.id || "").trim();

        const category =
          String(row.category || "").trim();

        const theme =
          String(row.theme || "").trim();

        const question =
          String(row.q || "").trim();

        const item =
          String(row.item || "").trim();

        const order =
          Number(row.order);


        if (
          !id ||
          !category ||
          !theme ||
          !question ||
          !item ||
          !Number.isFinite(order)
        ) {
          return;
        }


        if (!setMap[id]) {

          setMap[id] = {
            id: id,
            category: category,
            title: theme,
            question: question,
            items: []
          };

        }


        setMap[id].items.push({
          name: item,
          order: order,
          note: row.note || ""
        });

      });


      orderSets =
        Object.values(setMap);

    }


    function renderCategorySelect() {

      const categories =
        [...new Set(
          orderSets
            .map(set => set.category)
            .filter(Boolean)
        )];


      categorySelect.innerHTML =
        '<option value="">すべてのカテゴリ</option>';


      categories.forEach(category => {

        const option =
          document.createElement("option");

        option.value = category;
        option.textContent = category;

        categorySelect.appendChild(option);

      });

    }


    function updateProblemSelect() {

      const category =
        categorySelect.value;

      const filteredSets = category
        ? orderSets.filter(
            set => set.category === category
          )
        : orderSets;


      setSelect.innerHTML = "";


      filteredSets.forEach(set => {

        const option =
          document.createElement("option");

        option.value = set.id;
        option.textContent = set.title;

        setSelect.appendChild(option);

      });


      setSelect.disabled =
        filteredSets.length === 0;

    }


    function startSelectedOrder() {

      if (!setSelect.value) {
        return;
      }

      loadSet(setSelect.value);

    }


    function startRandomCategoryOrder() {

      const category =
        categorySelect.value;

      const candidates = category
        ? orderSets.filter(
            set => set.category === category
          )
        : orderSets;


      if (candidates.length === 0) {
        return;
      }


      const set =
        candidates[
          Math.floor(
            Math.random() * candidates.length
          )
        ];


      setSelect.value = set.id;
      loadSet(set.id);

    }


    function startRandomAllOrder() {

      if (orderSets.length === 0) {
        return;
      }


      const set =
        orderSets[
          Math.floor(
            Math.random() * orderSets.length
          )
        ];


      categorySelect.value = set.category;
      updateProblemSelect();

      setSelect.value = set.id;
      loadSet(set.id);

    }


    function loadSet(setId) {

      currentSet =
        orderSets.find(
          set => set.id === setId
        );


      if (!currentSet) {
        return;
      }


      checked = false;

      summary.classList.add("hidden");


      questionElement.textContent =
        currentSet.question;


      currentItems =
        shuffleArray(
          currentSet.items
        );


      renderOrder();

    }


    function shuffleArray(array) {

      const copied =
        [...array];


      for (
        let i = copied.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );


        [
          copied[i],
          copied[j]
        ] = [
          copied[j],
          copied[i]
        ];

      }


      return copied;

    }


    function renderOrder() {

      orderList.innerHTML = "";


      currentItems.forEach(
        (item, index) => {

          const row =
            document.createElement("div");

          row.className =
            "order-item";

          row.draggable =
            !checked;

          row.dataset.index =
            index;


          if (checked) {

            if (
              item.order === index + 1
            ) {

              row.classList.add(
                "correct"
              );

            } else {

              row.classList.add(
                "wrong"
              );

            }

          }


          const number =
            document.createElement("div");

          number.className =
            "order-position";

          number.textContent =
            index + 1;


          const name =
            document.createElement("div");

          name.className =
            "order-name";

          name.textContent =
            item.name;


          const controls =
            document.createElement("div");

          controls.className =
            "order-move-buttons";


          const up =
            document.createElement("button");

          up.type = "button";
          up.className = "order-move-btn";
          up.textContent = "↑";

          up.disabled =
            checked ||
            index === 0;

          up.addEventListener(
            "click",
            () => moveItem(
              index,
              index - 1
            )
          );


          const down =
            document.createElement("button");

          down.type = "button";
          down.className = "order-move-btn";
          down.textContent = "↓";

          down.disabled =
            checked ||
            index === currentItems.length - 1;

          down.addEventListener(
            "click",
            () => moveItem(
              index,
              index + 1
            )
          );


          controls.appendChild(up);
          controls.appendChild(down);

          row.appendChild(number);
          row.appendChild(name);
          row.appendChild(controls);


          if (checked) {

            const result =
              document.createElement("div");

            result.className =
              "order-result-text";


            if (
              item.order === index + 1
            ) {

              result.textContent =
                "○ 正しい位置";

            } else {

              result.textContent =
                `× 正解位置：${item.order}番`;

            }


            row.appendChild(result);

          }


          if (!checked) {

            row.addEventListener(
              "dragstart",
              handleDragStart
            );

            row.addEventListener(
              "dragover",
              handleDragOver
            );

            row.addEventListener(
              "drop",
              handleDrop
            );

            row.addEventListener(
              "dragend",
              handleDragEnd
            );

          }


          orderList.appendChild(row);

        }
      );

    }


    function moveItem(
      fromIndex,
      toIndex
    ) {

      if (
        checked ||
        toIndex < 0 ||
        toIndex >= currentItems.length
      ) {
        return;
      }


      const item =
        currentItems.splice(
          fromIndex,
          1
        )[0];


      currentItems.splice(
        toIndex,
        0,
        item
      );


      renderOrder();

    }


    function handleDragStart(event) {

      draggedIndex =
        Number(
          event.currentTarget
            .dataset.index
        );


      event.currentTarget
        .classList.add(
          "dragging"
        );


      event.dataTransfer
        .effectAllowed =
        "move";

    }


    function handleDragOver(event) {

      event.preventDefault();

      event.dataTransfer
        .dropEffect =
        "move";

    }


    function handleDrop(event) {

      event.preventDefault();


      const targetIndex =
        Number(
          event.currentTarget
            .dataset.index
        );


      if (
        draggedIndex === null ||
        draggedIndex === targetIndex
      ) {
        return;
      }


      moveItem(
        draggedIndex,
        targetIndex
      );


      draggedIndex = null;

    }


    function handleDragEnd(event) {

      event.currentTarget
        .classList.remove(
          "dragging"
        );

      draggedIndex = null;

    }


    function checkAnswers() {

     if (
        !currentSet ||
        checked
      ) {
        return;
      }

      checked = true;
      
      // 並び替えの項目数を今日の学習数に加算
      StudyTracker.record(
        currentItems.length
      );


      let correctCount = 0;


      currentItems.forEach(
        (item, index) => {

          if (
            item.order === index + 1
          ) {
            correctCount++;
          }

        }
      );


      renderOrder();

      renderCompleteOrder();


      scoreMain.textContent =
        `${correctCount} / ${currentItems.length}`;


      summary.classList.remove(
        "hidden"
      );


      summary.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    function renderCompleteOrder() {

      completeOrder.innerHTML = "";


      const correctItems =
        [...currentSet.items]
          .sort(
            (a, b) =>
              a.order - b.order
          );


      correctItems.forEach(item => {

        const row =
          document.createElement("div");

        row.className =
          "complete-row";


        const number =
          document.createElement("div");

        number.className =
          "complete-number";

        number.textContent =
          item.order;


        const name =
          document.createElement("div");

        name.className =
          "complete-name";

        name.textContent =
          item.name;


        row.appendChild(number);
        row.appendChild(name);

        completeOrder.appendChild(row);

      });

    }


    function resetQuiz() {

      if (!currentSet) {
        return;
      }


      checked = false;

      summary.classList.add(
        "hidden"
      );


      currentItems =
        shuffleArray(
          currentSet.items
        );


      renderOrder();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    init();

  </script>

</body>

</html>
